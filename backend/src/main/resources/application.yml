spring:
  application:
    name: urban-furniture-accounting

  # Local, gitignored overrides (DB credentials, JWT secret, S3 keys, Gemini key).
  # Copy application-local.yml.example -> application-local.yml and fill it in.
  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never mutate it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:}
    # 12 hours
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
    issuer: urban-furniture-accounting
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${AWS_ENDPOINT_URL_S3:}
    region: ${AWS_REGION:us-east-2}
    bucket: ${S3_BUCKET:urban-furniture-assets}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.urbanfurniture.accounting: INFO
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
